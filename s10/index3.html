<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriScan AI | Smart Terrain & Real Specimen</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;600;800&display=swap" rel="stylesheet">

<style>
/* --- Reset & Base --- */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { background-color: #020605; color: #e8f5e9; overflow-x: hidden; }

/* --- 3D Canvas --- */
#webgl-canvas {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1;
  pointer-events: none;
}

/* --- THE REAL PLANT (Foreground Image) --- */
#real-specimen {
  position: fixed;
  top: 15%;
  left: 50%;
  transform: translateX(-50%);
  width: 35vw; /* Scales with screen size */
  max-width: 500px;
  min-width: 300px;
  z-index: 5;
  pointer-events: none;
  /* Deep shadow to make it pop off the grid */
  filter: drop-shadow(0 40px 30px rgba(0,0,0,0.9)); 
  transform-style: preserve-3d;
  will-change: transform;
}

/* --- Layout & Typography --- */
.content { position: relative; z-index: 10; }
section { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 0 10%; position: relative; pointer-events: none; }
section > * { pointer-events: auto; }

h1 { font-size: clamp(3rem, 5vw, 6rem); font-weight: 800; line-height: 1.1; max-width: 800px; letter-spacing: -0.02em; text-shadow: 0 10px 30px rgba(0,0,0,0.8); }
p { font-size: 1.15rem; max-width: 500px; margin-top: 25px; color: #a5d6a7; font-weight: 300; line-height: 1.6; text-shadow: 0 5px 20px rgba(0,0,0,0.8); }

/* --- Navigation & Logo --- */
nav {
  position: fixed; top: 0; width: 100%; padding: 25px 8%; display: flex;
  justify-content: space-between; align-items: center; z-index: 100;
  background: linear-gradient(to bottom, rgba(2,6,5,0.9), transparent);
  pointer-events: auto;
}

.logo-container { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.logo-svg { width: 32px; height: 32px; color: #66bb6a; }
.logo-text { font-weight: 800; font-size: 1.5rem; letter-spacing: 1px; color: #ffffff; }
.logo-highlight { color: #66bb6a; }

/* Language Switcher */
.lang-switch {
  display: flex; gap: 5px; background: rgba(255, 255, 255, 0.05);
  padding: 4px; border-radius: 30px; backdrop-filter: blur(10px); 
  border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 20px rgba(0,0,0,0.2);
}
.lang-btn {
  background: transparent; border: none; color: #a5d6a7; padding: 8px 18px;
  border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.3s ease;
}
.lang-btn.active { background: #66bb6a; color: #050d0a; box-shadow: 0 0 15px rgba(102,187,106,0.5); }

/* --- Upload Section Styling --- */
.upload-section { align-items: center; text-align: center; }
.upload-box {
  margin-top: 50px; padding: 60px; border: 2px dashed rgba(102, 187, 106, 0.4);
  border-radius: 24px; background: linear-gradient(145deg, rgba(102, 187, 106, 0.05), rgba(2, 6, 5, 0.6));
  backdrop-filter: blur(15px); cursor: pointer; transition: all 0.4s ease;
  width: 100%; max-width: 650px; box-shadow: 0 30px 60px rgba(0,0,0,0.5);
}
.upload-box:hover { border-color: #66bb6a; transform: translateY(-5px); box-shadow: 0 40px 80px rgba(102, 187, 106, 0.2); }
.upload-icon { width: 60px; height: 60px; margin-bottom: 20px; opacity: 0.8; }

.btn-main {
  padding: 16px 45px; font-size: 1.1rem; font-weight: 700; color: #050d0a;
  background: #66bb6a; border: none; border-radius: 50px; cursor: pointer;
  margin-top: 25px; transition: transform 0.3s ease;
}
.btn-main:hover { transform: scale(1.05); background: #76c97a; }

/* --- Contact Section Styling --- */
.contact-section { align-items: flex-start; }
.form-container { width: 100%; max-width: 550px; margin-top: 50px; display: flex; flex-direction: column; gap: 20px; }
.glass-input {
  width: 100%; padding: 18px 25px; background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(102, 187, 106, 0.2); border-radius: 12px; color: #fff;
  backdrop-filter: blur(15px); outline: none; transition: all 0.3s ease;
}
.glass-input:focus { border-color: #66bb6a; background: rgba(102, 187, 106, 0.05); }
textarea.glass-input { height: 160px; resize: none; }
.btn-submit {
  padding: 18px; background: transparent; border: 2px solid #66bb6a; color: #66bb6a;
  font-weight: 700; border-radius: 12px; cursor: pointer; transition: all 0.3s ease; font-size: 1rem;
}
.btn-submit:hover { background: #66bb6a; color: #050d0a; }

/* --- Reveal Utility Classes --- */
.reveal-up { opacity: 0; }
.hero-reveal { opacity: 0; }
</style>
</head>
<body>

<canvas id="webgl-canvas"></canvas>

<img src="https://images.unsplash.com/photo-1610486663556-919fc2ceeb8b?q=80&w=800&auto=format&fit=crop&ixlib=rb-4.0.3" id="real-specimen" alt="Specimen Scan" style="mix-blend-mode: screen; border-radius: 20px;"> 
<div class="content">
  <nav>
    <div class="logo-container">
      <svg class="logo-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      <span class="logo-text">AgriScan<span class="logo-highlight">.AI</span></span>
    </div>

    <div class="lang-switch">
      <button class="lang-btn active" onclick="setLang('en')">EN</button>
      <button class="lang-btn" onclick="setLang('hi')">HI</button>
    </div>
  </nav>

  <section id="sec1">
    <h1 data-key="heroTitle" class="hero-reveal">Precision Agriculture.<br>Powered by Deep Learning.</h1>
    <p data-key="heroSub" class="hero-reveal">Scroll to initiate the topographical surface scan.</p>
  </section>

  <section id="sec2" class="upload-section">
    <h1 data-key="uploadTitle" class="reveal-up">Initialize Scan</h1>
    <p data-key="uploadSub" class="reveal-up">Upload your field imagery to begin the diagnostic protocol.</p>
    
    <div class="upload-box reveal-up" onclick="document.getElementById('fileInput').click()">
      <svg class="upload-icon" fill="none" stroke="#66bb6a" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
      <input type="file" id="fileInput" hidden accept="image/*">
      <p style="margin:0 0 15px 0; color: #fff; font-weight: 600;" data-key="dropText">Click or drag image here</p>
      <button class="btn-main" data-key="uploadBtn">Browse Files</button>
    </div>
  </section>

  <section id="sec3" class="contact-section">
    <h1 data-key="contactTitle" class="reveal-up">Establish Link.</h1>
    <p data-key="contactSub" class="reveal-up">Partner with us to deploy scalable AI solutions.</p>
    
    <form class="form-container" onsubmit="event.preventDefault();">
      <input type="text" class="glass-input reveal-up" placeholder="Name / Organization" data-key="formName">
      <input type="email" class="glass-input reveal-up" placeholder="Secure Email" data-key="formEmail">
      <textarea class="glass-input reveal-up" placeholder="Enter details..." data-key="formMessage"></textarea>
      <button type="submit" class="btn-submit reveal-up" data-key="formSubmit">Transmit Data</button>
    </form>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<script>
// --- MULTI-LANGUAGE TRANSLATION LOGIC ---
const i18n = {
  en: { heroTitle: "Precision Agriculture.<br>Powered by Deep Learning.", heroSub: "Scroll to initiate the topographical surface scan.", uploadTitle: "Initialize Scan", uploadSub: "Upload your field imagery to begin the diagnostic protocol.", dropText: "Click or drag image here", uploadBtn: "Browse Files", contactTitle: "Establish Link.", contactSub: "Partner with us to deploy scalable AI solutions.", formName: "Name / Organization", formEmail: "Secure Email", formMessage: "Enter details...", formSubmit: "Transmit Data" },
  hi: { heroTitle: "सटीक कृषि।<br>डीप लर्निंग द्वारा संचालित।", heroSub: "सतही स्कैन प्रारंभ करने के लिए नीचे स्क्रॉल करें।", uploadTitle: "स्कैन प्रारंभ करें", uploadSub: "निदान शुरू करने के लिए अपने खेत की छवि अपलोड करें।", dropText: "छवि यहां क्लिक करें या खींचें", uploadBtn: "फ़ाइलें ब्राउज़ करें", contactTitle: "संपर्क स्थापित करें।", contactSub: "एआई समाधान तैनात करने के लिए हमारे साथ भागीदार बनें।", formName: "नाम / संगठन", formEmail: "सुरक्षित ईमेल", formMessage: "विवरण दर्ज करें...", formSubmit: "डेटा भेजें" }
};
function setLang(lang) {
  document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  document.querySelectorAll('[data-key]').forEach(elem => {
    const key = elem.getAttribute('data-key');
    if (elem.tagName === 'INPUT' || elem.tagName === 'TEXTAREA') elem.placeholder = i18n[lang][key];
    else elem.innerHTML = i18n[lang][key];
  });
}

// --- 3D SCENE SETUP: SMART TERRAIN (OPTION A) ---
gsap.registerPlugin(ScrollTrigger);

const canvas = document.querySelector('#webgl-canvas');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x020605, 0.025); // Fades grid into distance

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 3, 10);
camera.rotation.x = -0.2;

const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

// Generate the sweeping wireframe grid
const geometry = new THREE.PlaneGeometry(80, 80, 80, 80);
const material = new THREE.MeshBasicMaterial({ 
  color: 0x66bb6a, 
  wireframe: true,
  transparent: true,
  opacity: 0.25
});
const terrain = new THREE.Mesh(geometry, material);
terrain.rotation.x = -Math.PI / 2; // Lay flat
scene.add(terrain);

// --- ANIMATION TIMELINES ---

// 1. Page Load Intro
const introTl = gsap.timeline({ defaults: { ease: "power3.out", duration: 1.5 } });
introTl
  .from("#real-specimen", { opacity: 0, scale: 0.8, duration: 2 }) // Fade in real leaf
  .from("nav", { y: -50, opacity: 0, duration: 1 }, "-=1.5")
  .to(".hero-reveal", { y: 0, opacity: 1, stagger: 0.2, duration: 1.2 }, "-=1");

// 2. Scroll Reveal
gsap.utils.toArray(".reveal-up").forEach((elem) => {
  gsap.fromTo(elem, 
    { y: 50, opacity: 0 }, 
    {
      y: 0, opacity: 1, duration: 1, ease: "power3.out",
      scrollTrigger: { trigger: elem, start: "top 85%", toggleActions: "play none none reverse" }
    }
  );
});

// 3. Cinematic Scroll: Terrain & Real Image Sync
const tl = gsap.timeline({
  scrollTrigger: { trigger: ".content", start: "top top", end: "bottom bottom", scrub: 1 }
});

// Animate the WebGL Camera over the terrain
tl.to(camera.position, { y: 1.5, z: 4, ease: "power2.inOut" }, 0)
  .to(camera.rotation, { x: 0, ease: "power2.inOut" }, 0)
  .to(material, { opacity: 0.7, color: new THREE.Color(0xffffff) }, 1); // Grid lights up at upload section

// SIMULTANEOUSLY animate the Real HTML Image in 3D perspective
tl.to("#real-specimen", { 
  scale: 1.4, // Zoom in
  rotationX: 35, // Tilt it back in 3D space
  rotationZ: -10, // Slight organic twist
  y: "25vh", // Move it down the screen as you scroll
  xPercent: -50, // Keep centered
  ease: "power2.inOut" 
}, 0);
// Move the real leaf out of the way for the contact form
tl.to("#real-specimen", { y: "100vh", opacity: 0, ease: "power1.in" }, 1);


// --- RENDER LOOP FOR TERRAIN WAVES ---
let time = 0;
const positionAttribute = geometry.attributes.position;
const originalPositions = positionAttribute.array.slice(); 

function animate() {
  requestAnimationFrame(animate);
  time += 0.015;

  // Make the terrain ripple and flow
  for(let i = 0; i < positionAttribute.count; i++) {
    const x = originalPositions[i * 3];
    const y = originalPositions[i * 3 + 1]; 
    const waveHeight = Math.sin(x * 0.4 + time) * 0.6 + Math.cos(y * 0.3 + time) * 0.6;
    positionAttribute.setZ(i, waveHeight);
  }
  
  positionAttribute.needsUpdate = true;
  terrain.position.z = (time * 3) % 5; // Simulates forward movement

  // Add a subtle continuous hover to the real image
  const leaf = document.getElementById('real-specimen');
  if(leaf) {
    leaf.style.transform = `translateX(-50%) translateY(${Math.sin(time*2)*10}px)`;
  }

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
