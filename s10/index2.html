<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriScan AI | Realistic Plant Analysis</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;600;800&display=swap" rel="stylesheet">

<style>
/* --- Reset & Base --- */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { background-color: #020605; color: #e8f5e9; overflow-x: hidden; }

/* --- 3D Canvas --- */
#webgl-canvas {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1;
  pointer-events: none;
  opacity: 0; 
}

/* --- Layout & Typography --- */
.content { position: relative; z-index: 10; }
section { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 0 10%; position: relative; }
h1 { font-size: clamp(3rem, 5vw, 6rem); font-weight: 800; line-height: 1.1; max-width: 800px; letter-spacing: -0.02em; text-shadow: 0 10px 30px rgba(0,0,0,0.5); }
p { font-size: 1.15rem; max-width: 500px; margin-top: 25px; color: #a5d6a7; font-weight: 300; line-height: 1.6; text-shadow: 0 5px 20px rgba(0,0,0,0.8); }

/* --- Navigation & Logo --- */
nav {
  position: fixed; top: 0; width: 100%; padding: 25px 8%; display: flex;
  justify-content: space-between; align-items: center; z-index: 100;
  background: linear-gradient(to bottom, rgba(2,6,5,0.9), transparent);
}
.logo-container { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.logo-svg { width: 32px; height: 32px; color: #66bb6a; filter: drop-shadow(0 0 10px rgba(102,187,106,0.8)); }
.logo-text { font-weight: 800; font-size: 1.5rem; letter-spacing: 1px; color: #ffffff; }
.logo-highlight { color: #66bb6a; }

/* Language Switcher */
.lang-switch {
  display: flex; gap: 5px; background: rgba(255, 255, 255, 0.05);
  padding: 4px; border-radius: 30px; backdrop-filter: blur(10px); 
  border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 20px rgba(0,0,0,0.2);
}
.lang-btn {
  background: transparent; border: none; color: #a5d6a7; padding: 8px 18px;
  border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.3s ease;
}
.lang-btn.active { background: #66bb6a; color: #050d0a; box-shadow: 0 0 15px rgba(102,187,106,0.5); }

/* --- Upload Section Styling --- */
.upload-section { align-items: flex-end; text-align: right; }
.upload-box {
  margin-top: 50px; padding: 60px; border: 2px dashed rgba(102, 187, 106, 0.4);
  border-radius: 24px; background: linear-gradient(145deg, rgba(102, 187, 106, 0.05), rgba(2, 6, 5, 0.6));
  backdrop-filter: blur(20px); cursor: pointer; transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
  width: 100%; max-width: 600px; box-shadow: 0 30px 60px rgba(0,0,0,0.5); margin-left: auto;
}
.upload-box:hover { border-color: #66bb6a; transform: translateY(-5px); box-shadow: 0 40px 80px rgba(102, 187, 106, 0.2); }
.upload-icon { width: 60px; height: 60px; margin-bottom: 20px; opacity: 0.8; filter: drop-shadow(0 0 15px rgba(102,187,106,0.6)); }

.btn-main {
  padding: 16px 45px; font-size: 1.1rem; font-weight: 700; color: #050d0a;
  background: #66bb6a; border: none; border-radius: 50px; cursor: pointer;
  margin-top: 25px; pointer-events: auto; transition: transform 0.3s ease, background 0.3s ease;
  box-shadow: 0 10px 20px -5px rgba(102, 187, 106, 0.5);
}
.btn-main:hover { transform: scale(1.05); background: #76c97a; }

/* --- Contact Section Styling --- */
.contact-section { align-items: flex-start; }
.form-container { width: 100%; max-width: 550px; margin-top: 50px; display: flex; flex-direction: column; gap: 20px; }
.glass-input {
  width: 100%; padding: 18px 25px; background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(102, 187, 106, 0.2); border-radius: 12px; color: #fff;
  font-size: 1rem; backdrop-filter: blur(25px); outline: none; transition: all 0.3s ease;
}
.glass-input:focus { border-color: #66bb6a; background: rgba(102, 187, 106, 0.05); }
textarea.glass-input { height: 160px; resize: none; }
.btn-submit {
  padding: 18px; background: transparent; border: 2px solid #66bb6a; color: #66bb6a;
  font-weight: 700; border-radius: 12px; cursor: pointer; transition: all 0.3s ease; font-size: 1rem;
}
.btn-submit:hover { background: #66bb6a; color: #050d0a; }

/* --- Reveal Utility Classes --- */
.reveal-up { opacity: 0; }
.hero-reveal { opacity: 0; }
</style>
</head>
<body>

<canvas id="webgl-canvas"></canvas>

<div class="content">
  <nav>
    <div class="logo-container">
      <svg class="logo-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
      <span class="logo-text">AgriScan<span class="logo-highlight">.AI</span></span>
    </div>

    <div class="lang-switch">
      <button class="lang-btn active" onclick="setLang('en')">EN</button>
      <button class="lang-btn" onclick="setLang('hi')">HI</button>
    </div>
  </nav>

  <section id="sec1">
    <h1 data-key="heroTitle" class="hero-reveal">Pest & Disease.<br>Detected Instantly.</h1>
    <p data-key="heroSub" class="hero-reveal">Scroll down to initiate the 360° AI drone scan sequence.</p>
  </section>

  <section id="sec2" class="upload-section">
    <h1 data-key="uploadTitle" class="reveal-up">Initialize Scan</h1>
    <p data-key="uploadSub" class="reveal-up" style="margin-left:auto;">Upload imagery to pinpoint pest locations and identify anomalies.</p>
    
    <div class="upload-box reveal-up" onclick="document.getElementById('fileInput').click()">
      <svg class="upload-icon" fill="none" stroke="#66bb6a" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
      <input type="file" id="fileInput" hidden accept="image/*">
      <p style="margin:0 0 15px 0; color: #fff; font-weight: 600;" data-key="dropText">Click or drag image here</p>
      <button class="btn-main" data-key="uploadBtn">Browse Files</button>
    </div>
  </section>

  <section id="sec3" class="contact-section">
    <h1 data-key="contactTitle" class="reveal-up">Establish Link.</h1>
    <p data-key="contactSub" class="reveal-up">Partner with us to deploy scalable AI solutions.</p>
    
    <form class="form-container" onsubmit="event.preventDefault();">
      <input type="text" class="glass-input reveal-up" placeholder="Name / Organization" data-key="formName" required>
      <input type="email" class="glass-input reveal-up" placeholder="Secure Email" data-key="formEmail" required>
      <textarea class="glass-input reveal-up" placeholder="Enter details..." data-key="formMessage" required></textarea>
      <button type="submit" class="btn-submit reveal-up" data-key="formSubmit">Transmit Data</button>
    </form>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<script>
// --- MULTI-LANGUAGE TRANSLATION LOGIC ---
const i18n = {
  en: { heroTitle: "Pest & Disease.<br>Detected Instantly.", heroSub: "Scroll down to initiate the 360° AI drone scan sequence.", uploadTitle: "Initialize Scan", uploadSub: "Upload imagery to pinpoint pest locations and identify anomalies.", dropText: "Click or drag image here", uploadBtn: "Browse Files", contactTitle: "Establish Link.", contactSub: "Partner with us to deploy scalable AI solutions.", formName: "Name / Organization", formEmail: "Secure Email", formMessage: "Enter details...", formSubmit: "Transmit Data" },
  hi: { heroTitle: "कीट और रोग।<br>तुरंत पता लगाया गया।", heroSub: "360° एआई ड्रोन स्कैन शुरू करने के लिए नीचे स्क्रॉल करें।", uploadTitle: "स्कैन प्रारंभ करें", uploadSub: "कीट स्थानों को इंगित करने के लिए चित्र अपलोड करें।", dropText: "छवि यहां क्लिक करें या खींचें", uploadBtn: "फ़ाइलें ब्राउज़ करें", contactTitle: "संपर्क स्थापित करें।", contactSub: "एआई समाधान तैनात करने के लिए हमारे साथ भागीदार बनें।", formName: "नाम / संगठन", formEmail: "सुरक्षित ईमेल", formMessage: "विवरण दर्ज करें...", formSubmit: "डेटा भेजें" }
};

function setLang(lang) {
  document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  document.querySelectorAll('[data-key]').forEach(elem => {
    const key = elem.getAttribute('data-key');
    if (elem.tagName === 'INPUT' || elem.tagName === 'TEXTAREA') elem.placeholder = i18n[lang][key];
    else elem.innerHTML = i18n[lang][key];
  });
}

// --- 3D SCENE SETUP ---
gsap.registerPlugin(ScrollTrigger);
const canvas = document.querySelector('#webgl-canvas');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x020605, 0.02);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 5, 25);

const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// --- REALISTIC LIGHTING ---
scene.add(new THREE.AmbientLight(0xffffff, 0.3));

const mainLight = new THREE.DirectionalLight(0xffffff, 1.5);
mainLight.position.set(15, 30, 15);
mainLight.castShadow = true;
mainLight.shadow.mapSize.width = 2048;
mainLight.shadow.mapSize.height = 2048;
// Expand shadow camera to cover the whole tall plant
mainLight.shadow.camera.top = 20; mainLight.shadow.camera.bottom = -20;
mainLight.shadow.camera.left = -20; mainLight.shadow.camera.right = 20;
scene.add(mainLight);

const fillLight = new THREE.PointLight(0x66bb6a, 0.5, 50);
fillLight.position.set(-10, -10, 10);
scene.add(fillLight);

// --- PROCEDURAL REALISTIC PLANT GENERATION ---
const plantGroup = new THREE.Group();
plantGroup.position.y = -10; // Shift down so it grows upward
scene.add(plantGroup);

// Materials
const stemMat = new THREE.MeshStandardMaterial({ color: 0x3d5a30, roughness: 0.8, metalness: 0.1 });
const leafMat = new THREE.MeshStandardMaterial({ color: 0x4caf50, roughness: 0.4, metalness: 0.1, side: THREE.DoubleSide });
const bugBodyMat = new THREE.MeshStandardMaterial({ color: 0xd84315, roughness: 0.3, metalness: 0.2, emissive: 0x3a0d04 }); // Red beetle
const bugHeadMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.6 });

// 1. Create Main Stem (curved upward)
const stemPoints = [];
for(let i=0; i<=20; i++) {
  const y = (i/20) * 35; // 35 units tall
  const x = Math.sin(y * 0.15) * 1.5; // Slight organic waving
  const z = Math.cos(y * 0.2) * 1.5;
  stemPoints.push(new THREE.Vector3(x, y, z));
}
const stemCurve = new THREE.CatmullRomCurve3(stemPoints);
const stemGeo = new THREE.TubeGeometry(stemCurve, 64, 0.5, 12, false);
const stem = new THREE.Mesh(stemGeo, stemMat);
stem.castShadow = true; stem.receiveShadow = true;
plantGroup.add(stem);

// 2. Base Leaf Geometry (Squashing a sphere makes a perfectly organic 3D leaf!)
const baseLeafGeo = new THREE.SphereGeometry(2, 24, 24);
baseLeafGeo.scale(0.8, 2.5, 0.05); // Stretch into a leaf shape
baseLeafGeo.translate(0, 2.5, 0); // Move origin to base
baseLeafGeo.computeVertexNormals(); // Fix lighting after scale

const insects = []; // Store bugs for animation

// 3. Generate Branches and Leaves
for(let i=3; i<18; i++) {
  const t = i/20; // Position along main stem
  const pt = stemCurve.getPoint(t);
  
  // Branch setup
  const angle = i * 2.399; // Golden ratio spread creates natural spirals
  const branchLen = 4 - (t * 2); // Branches get shorter near the top
  const endX = pt.x + Math.cos(angle) * branchLen;
  const endZ = pt.z + Math.sin(angle) * branchLen;
  const endY = pt.y + 1.5;
  const branchEnd = new THREE.Vector3(endX, endY, endZ);

  // Draw Branch
  const branchCurve = new THREE.CatmullRomCurve3([pt, branchEnd]);
  const branchGeo = new THREE.TubeGeometry(branchCurve, 16, 0.12, 8, false);
  const branch = new THREE.Mesh(branchGeo, stemMat);
  branch.castShadow = true; branch.receiveShadow = true;
  plantGroup.add(branch);

  // Attach Leaf
  const leaf = new THREE.Mesh(baseLeafGeo, leafMat);
  leaf.position.copy(branchEnd);
  // Point leaf outward from the stem, and bend it down slightly
  leaf.lookAt(new THREE.Vector3(pt.x, pt.y - 10, pt.z));
  leaf.castShadow = true; leaf.receiveShadow = true;
  plantGroup.add(leaf);

  // 4. Spawn Insects on random leaves
  if (i % 3 === 0 || i === 12) {
    const bugGroup = new THREE.Group();
    
    // Bug Body
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), bugBodyMat);
    body.scale.set(1, 1.2, 0.7); // Oval shape
    body.castShadow = true;

    // Bug Head
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), bugHeadMat);
    head.position.set(0, 0.35, 0.05);
    head.castShadow = true;

    bugGroup.add(body);
    bugGroup.add(head);

    // Attach to leaf surface
    bugGroup.position.set(0, 2.5, 0.15); // Local coords relative to leaf
    leaf.add(bugGroup);

    // Save for animation loop
    insects.push({ 
      mesh: bugGroup, 
      baseY: bugGroup.position.y, 
      speed: Math.random() * 0.05 + 0.02 
    });
  }
}

// --- ANIMATION TIMELINES ---

// 1. Intro Animation
const introTl = gsap.timeline({ defaults: { ease: "power3.out", duration: 1.5 } });
introTl
  .to("#webgl-canvas", { opacity: 1, duration: 2.5 })
  .from("nav", { y: -50, opacity: 0, duration: 1 }, "-=2")
  .to(".hero-reveal", { y: 0, opacity: 1, stagger: 0.2, duration: 1.2 }, "-=1");

// 2. Scroll Reveal Data Inputs
gsap.utils.toArray(".reveal-up").forEach((elem) => {
  gsap.fromTo(elem, { y: 60, opacity: 0 }, {
    y: 0, opacity: 1, duration: 1.2, ease: "power4.out",
    scrollTrigger: { trigger: elem, start: "top 85%", toggleActions: "play none none reverse" }
  });
});

// 3. Cinematic 360° Plant Orbit Scroll
const orbitTl = gsap.timeline({
  scrollTrigger: { trigger: ".content", start: "top top", end: "bottom bottom", scrub: 1.5 }
});

// As user scrolls, the camera orbits around the plant to inspect it, and moves down.
orbitTl.to(plantGroup.rotation, { y: Math.PI * 2, ease: "none" }, 0) // Full 360 spin
       .to(camera.position, { y: 15, z: 18, x: -10, ease: "power1.inOut" }, 0) // Move in closer
       
       // Second section rotation and framing
       .to(plantGroup.rotation, { y: Math.PI * 4, ease: "none" }, 1)
       .to(camera.position, { y: 25, z: 12, x: 10, ease: "power1.inOut" }, 1);

// --- RENDER & SIMULATION LOOP ---
function animate() {
  requestAnimationFrame(animate);
  
  const time = Date.now() * 0.001;

  // Gentle wind effect on the whole plant
  plantGroup.rotation.z = Math.sin(time * 0.5) * 0.02;

  // Animate the insects crawling back and forth on the leaves
  insects.forEach((bug) => {
    // Math.sin creates a back-and-forth ping-pong movement
    const movement = Math.sin(time * bug.speed);
    bug.mesh.position.y = bug.baseY + (movement * 1.5);
    
    // Rotate the bug so it faces the direction it is walking
    // If movement is increasing, face forward (0), else face backward (PI)
    const direction = Math.cos(time * bug.speed); 
    bug.mesh.rotation.x = direction > 0 ? 0 : Math.PI;
  });

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
